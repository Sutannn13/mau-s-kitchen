name: Deploy staging to Cloudflare Workers

on:
  push:
    branches: [codex/staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies (high+)
        run: npm audit --audit-level=high --omit=dev

  deploy:
    name: Deploy isolated staging worker
    needs: quality
    if: vars.STAGING_READY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEXT_PUBLIC_SITE_URL: https://staging.maukitchen.my.id
      NEXT_PUBLIC_SITE_NAME: "MAU'S Kitchen"
      NEXT_PUBLIC_WHATSAPP_NUMBER: "6281617691585"
      NEXT_PUBLIC_WHATSAPP_DISPLAY: 0816-1769-1585
      NEXT_PUBLIC_ENABLE_QRIS: "true"
      NEXT_PUBLIC_ENABLE_TRANSFER: "false"
      NEXT_PUBLIC_ENABLE_CASH: "true"
      NEXT_PUBLIC_QRIS_IMAGE_PATH: /assets/payment/qris.jpeg
      NEXT_PUBLIC_QRIS_MERCHANT_NAME: SATE TAICHAN HANNA
      NEXT_PUBLIC_BANK_NAME: BCA
      NEXT_PUBLIC_BANK_ACCOUNT_NUMBER: TBD
      NEXT_PUBLIC_BANK_ACCOUNT_NAME: TBD
      NEXT_PUBLIC_SUPABASE_URL: https://srnmwvgbokmxjxdsplqu.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_PuW_mW4v6Rx9TvQQ98qqFw_PovY-rD5
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
      ORDER_RETENTION_DAYS: "90"
      NEXT_PUBLIC_BUSINESS_HOURS: ${{ secrets.NEXT_PUBLIC_BUSINESS_HOURS }}
      NEXT_PUBLIC_BUSINESS_ADDRESS: ${{ secrets.NEXT_PUBLIC_BUSINESS_ADDRESS }}
      NEXT_PUBLIC_INSTAGRAM_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy staging
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify staging health
        run: |
          url="${NEXT_PUBLIC_SITE_URL%/}/api/health"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo 000)
            echo "Percobaan $attempt — HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Health check staging lulus."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check staging gagal; jangan promosikan ke production."
          exit 1
