name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Hak minimum: deploy memakai CLOUDFLARE_API_TOKEN, bukan OIDC.
permissions:
  contents: read

# Cegah dua deploy berjalan bersamaan (rilis lama bisa menimpa yang baru).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies (high+)
        run: npm audit --audit-level=high --omit=dev

  deploy:
    name: Deploy to Cloudflare Workers
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    # Env di level job: `npm run deploy` menjalankan `opennextjs-cloudflare build`
    # yang mem-build ulang Next.js, dan nilai NEXT_PUBLIC_* di-inline ke bundle
    # browser saat build itu. Bila hanya step build yang diberi env, bundle yang
    # benar-benar ter-deploy berisi nilai kosong (login admin & URL absolut rusak).
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
      NEXT_PUBLIC_WHATSAPP_DISPLAY: ${{ secrets.NEXT_PUBLIC_WHATSAPP_DISPLAY }}
      NEXT_PUBLIC_ENABLE_QRIS: ${{ secrets.NEXT_PUBLIC_ENABLE_QRIS }}
      NEXT_PUBLIC_ENABLE_TRANSFER: ${{ secrets.NEXT_PUBLIC_ENABLE_TRANSFER }}
      NEXT_PUBLIC_ENABLE_CASH: ${{ secrets.NEXT_PUBLIC_ENABLE_CASH }}
      NEXT_PUBLIC_QRIS_IMAGE_PATH: ${{ secrets.NEXT_PUBLIC_QRIS_IMAGE_PATH }}
      NEXT_PUBLIC_QRIS_MERCHANT_NAME: ${{ secrets.NEXT_PUBLIC_QRIS_MERCHANT_NAME }}
      NEXT_PUBLIC_BANK_NAME: ${{ secrets.NEXT_PUBLIC_BANK_NAME }}
      NEXT_PUBLIC_BANK_ACCOUNT_NUMBER: ${{ secrets.NEXT_PUBLIC_BANK_ACCOUNT_NUMBER }}
      NEXT_PUBLIC_BANK_ACCOUNT_NAME: ${{ secrets.NEXT_PUBLIC_BANK_ACCOUNT_NAME }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
      ORDER_RETENTION_DAYS: ${{ secrets.ORDER_RETENTION_DAYS }}
      NEXT_PUBLIC_BUSINESS_HOURS: ${{ secrets.NEXT_PUBLIC_BUSINESS_HOURS }}
      NEXT_PUBLIC_BUSINESS_ADDRESS: ${{ secrets.NEXT_PUBLIC_BUSINESS_ADDRESS }}
      NEXT_PUBLIC_INSTAGRAM_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Gerbang terakhir: /api/health hanya 200 bila Supabase, allowlist admin,
      # dan konfigurasi retensi benar-benar siap di runtime produksi.
      - name: Verify deployment health
        run: |
          if [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SITE_URL belum diset sebagai secret."
            exit 1
          fi
          url="${NEXT_PUBLIC_SITE_URL%/}/api/health"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || echo 000)
            echo "Percobaan $attempt — HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Health check lulus."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Health check gagal; deploy perlu diperiksa/rollback."
          exit 1

      - name: Deploy status
        run: |
          echo "Deploy ke Cloudflare Workers selesai."
          echo "Live: ${NEXT_PUBLIC_SITE_URL}"
